[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markov-entropy"
version = "0.3.0"
description = "Finite Markov categories and experimental density, partition, and sampling information calculations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "jiangnan"}]
keywords = ["markov-categories", "information-theory", "entropy", "probability", "string-diagrams"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "nbval>=0.11",
]
notebooks = ["jupyter>=1", "matplotlib>=3.8"]
discopy = ["discopy==1.2.2"]

[project.urls]
Repository = "https://github.com/jiangnan030-del/markov-entropy"
Documentation = "https://github.com/jiangnan030-del/markov-entropy/tree/main/docs"
Changelog = "https://github.com/jiangnan030-del/markov-entropy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/markov_entropy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=markov_entropy --cov-report=term-missing --cov-fail-under=90"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "nbval>=0.11",
    "jupyter>=1",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["markov_entropy"]

[[tool.mypy.overrides]]
module = ["discopy", "discopy.*"]
ignore_missing_imports = true
