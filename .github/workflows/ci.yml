name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src/markov_entropy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: uv run pytest
      - run: uv run python examples/basic_demo.py

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run pytest --nbval examples/ -p no:cacheprovider --override-ini="addopts="
      - run: uv run pytest tests/test_readme_doctest.py --override-ini="addopts="

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run python examples/render_discopy_gallery.py --output build/diagrams
      - run: test "$(find build/diagrams -name '*.svg' | wc -l)" -eq 13
      - uses: actions/upload-artifact@v4
        with:
          name: discopy-diagram-gallery
          path: build/diagrams

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv build
      - run: uv venv --python 3.12 .venv-wheel
      - run: uv pip install --python .venv-wheel/bin/python dist/*.whl
      - run: .venv-wheel/bin/python -c "import markov_entropy; print(markov_entropy.__doc__)"
