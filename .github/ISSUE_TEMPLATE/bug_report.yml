name: Bug report
description: Report incorrect behavior or a numerical issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.11", "3.12", "3.13", "Other"]
    validations:
      required: true
  - type: textarea
    id: mathematical_context
    attributes:
      label: Mathematical context
      description: Include the expected identity, assumptions, and zero-support behavior.
